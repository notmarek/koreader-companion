name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libcjson-dev

    - name: Test cJSON compatibility stubs against modern libcjson
      run: |
        gcc tests/cjson_stub_test.c stubs/cjson_addboolfixup.c $(pkg-config --cflags --libs libcjson) -o /tmp/cjson_stub_test
        /tmp/cjson_stub_test

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run tests
      run: cargo test --target x86_64-unknown-linux-gnu -p kompanion_extractor -p kompanion_launcher

  build-kindlehf:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y jq file

    - name: Download toolchain
      run: wget -q https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz -O - | tar -xzf - -C ~

    - name: Add toolchain to PATH
      run: echo "$HOME/x-tools/arm-kindlehf-linux-gnueabihf/bin" >> $GITHUB_PATH

    - name: Create stub libraries (Kindle system libs, resolved at runtime)
      run: |
        HF=$HOME/x-tools/arm-kindlehf-linux-gnueabihf/arm-kindlehf-linux-gnueabihf/sysroot/usr/lib
        chmod u+w $HF
        arm-kindlehf-linux-gnueabihf-gcc -shared -fPIC -o $HF/liblipc.so stubs/lipc_stub.c
        arm-kindlehf-linux-gnueabihf-gcc -shared -fPIC -o $HF/libscanner.so stubs/scanner_stub.c
        arm-kindlehf-linux-gnueabihf-gcc -c -o /tmp/cjson_addboolfixup.o stubs/cjson_addboolfixup.c

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: armv7-unknown-linux-gnueabihf

    - name: Build
      run: |
        # cjson stub only on the extractor: on the launcher it makes the linker
        # pull the sysroot libcjson.so and fail ("DSO missing from command line")
        RUSTFLAGS="-C link-arg=/tmp/cjson_addboolfixup.o" \
          cargo build --release --target armv7-unknown-linux-gnueabihf \
            --features kompanion_sys/real-lipc,kompanion_sys/real-scanner -p kompanion_extractor
        cargo build --release --target armv7-unknown-linux-gnueabihf \
          --features kompanion_sys/real-lipc,kompanion_sys/real-scanner -p kompanion_launcher

    - name: Package
      run: |
        VERSION=$(jq -r '.version | join(".")' kpm/manifest.json)
        mkdir -p dist build/kindlehf/bin build/kindlehf/lib
        cp kpm/install.sh kpm/install.sql kpm/manifest.json kpm/uninstall.sh kpm/uninstall.sql build/
        cp target/armv7-unknown-linux-gnueabihf/release/kompanion_launcher build/kindlehf/bin/
        cp target/armv7-unknown-linux-gnueabihf/release/libkompanion_extractor.so build/kindlehf/lib/
        file build/kindlehf/bin/kompanion_launcher

    - uses: actions/upload-artifact@v4
      with:
        name: kompanion-kindlehf
        path: build/kindlehf/

  build-kindlepw2:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y jq file

    - name: Download toolchain
      run: wget -q https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlepw2.tar.gz -O - | tar -xzf - -C ~

    - name: Add toolchain to PATH
      run: echo "$HOME/x-tools/arm-kindlepw2-linux-gnueabi/bin" >> $GITHUB_PATH

    - name: Create stub libraries (Kindle system libs, resolved at runtime)
      run: |
        PW2=$HOME/x-tools/arm-kindlepw2-linux-gnueabi/arm-kindlepw2-linux-gnueabi/sysroot/usr/lib
        chmod u+w $PW2
        arm-kindlepw2-linux-gnueabi-gcc -shared -fPIC -o $PW2/liblipc.so stubs/lipc_stub.c
        arm-kindlepw2-linux-gnueabi-gcc -shared -fPIC -o $PW2/libscanner.so stubs/scanner_stub.c
        arm-kindlepw2-linux-gnueabi-gcc -c -o /tmp/getauxval_stub.o stubs/getauxval_stub.c
        arm-kindlepw2-linux-gnueabi-gcc -c -o /tmp/cjson_addboolfixup.o stubs/cjson_addboolfixup.c

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: armv7-unknown-linux-gnueabi

    - name: Build
      run: |
        # cjson stub only on the extractor (see kindlehf job); getauxval stub
        # is needed by both binaries on the kindlepw2 glibc 2.12 sysroot
        RUSTFLAGS="-C link-arg=/tmp/getauxval_stub.o -C link-arg=/tmp/cjson_addboolfixup.o" \
          cargo build --release --target armv7-unknown-linux-gnueabi \
            --features kompanion_sys/real-lipc,kompanion_sys/real-scanner -p kompanion_extractor
        RUSTFLAGS="-C link-arg=/tmp/getauxval_stub.o" \
          cargo build --release --target armv7-unknown-linux-gnueabi \
            --features kompanion_sys/real-lipc,kompanion_sys/real-scanner -p kompanion_launcher

    - name: Package
      run: |
        VERSION=$(jq -r '.version | join(".")' kpm/manifest.json)
        mkdir -p dist build/kindlepw2/bin build/kindlepw2/lib
        cp kpm/install.sh kpm/install.sql kpm/manifest.json kpm/uninstall.sh kpm/uninstall.sql build/
        cp target/armv7-unknown-linux-gnueabi/release/kompanion_launcher build/kindlepw2/bin/
        cp target/armv7-unknown-linux-gnueabi/release/libkompanion_extractor.so build/kindlepw2/lib/
        file build/kindlepw2/bin/kompanion_launcher

    - uses: actions/upload-artifact@v4
      with:
        name: kompanion-kindlepw2
        path: build/kindlepw2/

  package:
    runs-on: ubuntu-latest
    needs: [build-kindlehf, build-kindlepw2]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: kompanion-kindlehf
        path: build/kindlehf/

    - uses: actions/download-artifact@v4
      with:
        name: kompanion-kindlepw2
        path: build/kindlepw2/

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Assemble kpkg
      run: |
        VERSION=$(jq -r '.version | join(".")' kpm/manifest.json)
        mkdir -p dist
        cp kpm/install.sh kpm/install.sql kpm/manifest.json kpm/uninstall.sh kpm/uninstall.sql build/
        (cd build && python3 -c "
        import tarfile, os
        with tarfile.open('../dist/kompanion-${VERSION}.kpkg', 'w:gz', compresslevel=5) as tar:
            for name in sorted(os.listdir('.')):
                if not name.startswith('.'):
                    tar.add(name)
        ")
        ls -lh dist/

    - uses: actions/upload-artifact@v4
      with:
        name: kompanion-kpkg
        path: dist/
