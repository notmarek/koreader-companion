[workspace]
members = [
    "koreader_companion_core",
    "koreader_companion_sys",
    "koreader_companion_extractor",
    "koreader_companion_launcher",
]
resolver = "2"

[workspace.package]
version = "4.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
log = "0.4"
epub-stream = "0.1"
url = "2"
zip = "2"
