[workspace]
members = [
    "sh_integration_core",
    "sh_integration_sys",
    "sh_integration_extractor",
    "sh_integration_launcher",
]
resolver = "2"

[workspace.package]
version = "4.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
log = "0.4"
